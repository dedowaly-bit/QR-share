<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنزيل الملف — QR Share</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#e0e0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#141428;border:1px solid #2a2a45;border-radius:20px;padding:32px;text-align:center;max-width:420px;width:100%}
.logo{width:56px;height:56px;background:linear-gradient(135deg,#7c4dff,#00e5a0);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px}
h1{font-size:20px;margin-bottom:8px}
.fname{font-size:14px;color:#9c7bff;word-break:break-all;margin:14px 0;padding:12px;background:#1a1a35;border-radius:12px}
.btn{display:inline-block;width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;background:#7c4dff;color:#fff;text-decoration:none;cursor:pointer;transition:.2s}
.btn:hover{background:#6a3de8}
.hint{font-size:12px;color:#6a6a8a;margin-top:16px;line-height:1.6}
.spin{margin:30px auto;width:42px;height:42px;border:4px solid #2a2a45;border-top-color:#7c4dff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ff5470;font-size:14px;padding:14px;background:rgba(255,84,112,.1);border-radius:12px;margin:14px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📥</div>
  <h1>ملفك جاهز للتنزيل</h1>
  <div id="loading"><div class="spin"></div><div class="hint">جاري تجهيز الملف...</div></div>
  <div id="content" style="display:none">
    <div class="fname" id="fn">—</div>
    <a class="btn" id="dl" href="#" download>⬇️ تنزيل الملف</a>
    <div class="hint">لو مفتحش تنزيل تلقائي، دوس الزر. الملف مرفوع على GitHub.</div>
  </div>
  <div id="error" class="err" style="display:none"></div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const f=params.get('f');
  if(!f){
    document.getElementById('loading').style.display='none';
    const e=document.getElementById('error');e.style.display='block';
    e.textContent='الرابط ناقص (مفيش اسم ملف).';
    return;
  }
  const raw='https://raw.githubusercontent.com/dedowaly-bit/QR-share/main/'+f;
  const name=f.split('/').pop();
  document.getElementById('fn').textContent=name;
  const a=document.getElementById('dl');
  a.href=raw;
  a.setAttribute('download',name);
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  // auto-trigger download
  setTimeout(()=>{ a.click(); },400);
})();
</script>
</body>
</html>
