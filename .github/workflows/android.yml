name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter config --no-analytics
          flutter create --org com.qrshareapp --project-name qr_share --platforms android .

      - name: Apply custom AndroidManifest
        run: cp tools/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Remove template tests
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: cp build/app/outputs/flutter-apk/app-release.apk qr-share.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-share-apk
          path: qr-share.apk

  publish-latest:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: qr-share-apk
          path: .

      - name: Delete old latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest APK"
          prerelease: true
          files: qr-share.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: qr-share-apk
          path: .

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: qr-share.apk

  deploy-web:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include_files: index.html,qrcode.min.js,html5-qrcode.min.js

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
